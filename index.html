<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Typing Game</title>
        <link rel="stylesheet" href="style.css" type="text/css" media="screen" title="no title" charset="utf-8">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="name" class="input-container">
            <input type="file"id="read-file" onchange="readFile(this)"/>
        </div>
        <!-- <h1>Typing game!</h1> -->
        <p>Click on the box and press "escape" to begin!</p>
        <div class="quote-container"><p id="quote"></p></div> <!-- This will display our quote -->
        <p id="message"></p> <!-- This will display any status messages -->
        <div>
            <input type="text" aria-label="current word" id="typed-value" onfocusout="focus(this)" style="opacity:0.0"/> <!-- The textbox for typing -->
        </div>
    </body>
</html>
